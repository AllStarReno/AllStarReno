<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Estimate Request | All-Star Renovations</title>
  <meta name="description" content="Request a free bathroom remodel estimate. All-Star Renovations, Conway AR. Call (501) 504-3398 or submit the form.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-xl mx-auto px-6 py-12">
    <a href="/" class="text-emerald-600 font-semibold">← Back to Home</a>
    <h1 class="text-3xl font-bold mt-6 mb-2">Request a Free Estimate</h1>
    <p class="text-slate-600 mb-6">We'll reply to info@allstarreno.com. Or call (501) 504-3398.</p>

    <form action="mailto:info@allstarreno.com" method="POST" enctype="text/plain" class="bg-white p-6 rounded-2xl shadow space-y-4">
      <input type="text" name="Name" placeholder="Your Name" required class="w-full border rounded-lg px-4 py-3">
      <input type="tel" name="Phone" placeholder="Phone" required class="w-full border rounded-lg px-4 py-3">
      <input type="email" name="Email" placeholder="Email" class="w-full border rounded-lg px-4 py-3">
      <select name="Service" class="w-full border rounded-lg px-4 py-3">
        <option>Walk-In Shower / All-Star Shower System</option>
        <option>Tub-to-Shower Conversion</option>
        <option>Walk-In Tub</option>
        <option>Aging-in-Place / ADA</option>
        <option>Other</option>
      </select>
      <textarea name="Project Details" placeholder="Tell us about your bathroom" rows="4" class="w-full border rounded-lg px-4 py-3"></textarea>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg">Send Estimate Request</button>
    </form>

    <div class="mt-8 text-center space-y-3">
      <a href="https://client.swivl.tech/all-star-renovate-318dbc/instant-quote?widget=instant-quote" target="_blank" class="block bg-slate-900 text-white py-3 rounded-lg font-semibold">Open Instant Quote Tool</a>
      <a href="https://client.swivl.tech/all-star-renovate-318dbc/scheduler?widget=scheduler" target="_blank" class="block border border-emerald-600 text-emerald-600 py-3 rounded-lg font-semibold">Schedule a Consultation</a>
      <a href="tel:5015043398" class="block text-emerald-600 font-semibold">Call (501) 504-3398</a>
    </div>
  </div>
</body>
</html>
