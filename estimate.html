<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Estimate Request | All-Star Renovations</title>
  <meta name="description" content="Request a free bathroom remodel estimate. All-Star Renovations, Conway AR. Call (501) 504-3398.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-lg mx-auto px-4 py-8 sm:py-12">
    <a href="/" class="text-emerald-600 font-semibold text-sm">← Back to Home</a>
    <h1 class="text-2xl sm:text-3xl font-bold mt-4 mb-2">Request a Free Estimate</h1>
    <p class="text-slate-600 text-sm mb-6">All estimates are 100% free with no obligation. We'll reply to info@allstarreno.com or call you.</p>

    <form action="mailto:info@allstarreno.com" method="POST" enctype="text/plain" class="bg-white p-5 sm:p-6 rounded-2xl shadow space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">First Name</label>
          <input type="text" name="First Name" placeholder="John" required class="w-full border rounded-xl px-4 py-3 text-base">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Last Name</label>
          <input type="text" name="Last Name" placeholder="Doe" required class="w-full border rounded-xl px-4 py-3 text-base">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
        <input type="email" name="Email" placeholder="john@example.com" required class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Phone</label>
        <input type="tel" name="Phone" placeholder="(501) 555-1234" required class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Service</label>
        <select name="Service" class="w-full border rounded-xl px-4 py-3 text-base">
          <option>Bathroom Remodeling</option>
          <option>Kitchen Remodeling</option>
          <option>Handyman Services</option>
          <option>Not Sure</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">City</label>
        <input type="text" name="City" placeholder="e.g. Conway, Maumelle, Cabot" class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Preferred Date</label>
          <input type="date" name="Preferred Date" class="w-full border rounded-xl px-4 py-3 text-base">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Time Window</label>
          <select name="Time Window" class="w-full border rounded-xl px-4 py-3 text-base">
            <option>Flexible</option>
            <option>Morning (9AM–12PM)</option>
            <option>Early Afternoon (12PM–3PM)</option>
            <option>Late Afternoon (3PM–6PM)</option>
            <option>Evening (6PM–7:30PM)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Project Details</label>
        <textarea name="Details" placeholder="Tell us about your project" rows="4" class="w-full border rounded-xl px-4 py-3 text-base"></textarea>
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl text-base">Send Estimate Request</button>
    </form>

    <div class="mt-8 space-y-3 text-center">
      <a href="https://client.swivl.tech/all-star-renovate-318dbc/instant-quote?widget=instant-quote" target="_blank" class="block bg-slate-900 text-white py-3.5 rounded-xl font-semibold">Instant Quote Tool</a>
      <a href="https://client.swivl.tech/all-star-renovate-318dbc/scheduler?widget=scheduler" target="_blank" class="block border-2 border-emerald-600 text-emerald-600 py-3.5 rounded-xl font-semibold">Schedule a Consultation</a>
      <a href="tel:5015043398" class="block text-emerald-600 font-semibold py-2">Call (501) 504-3398</a>
    </div>
  </div>
</body>
</html>
