<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Estimate — Location | All-Star Renovations</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-lg mx-auto px-4 py-8">
    <a href="/" class="text-emerald-600 font-semibold text-sm">← Back</a>
    <h1 class="text-2xl font-bold mt-4 mb-2">Request a Free Estimate</h1>
    <p class="text-sm text-slate-600 mb-6">All estimates are 100% free with no obligation.</p>

    <form action="mailto:info@allstarreno.com" method="POST" enctype="text/plain" class="bg-white p-5 rounded-2xl shadow space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">First Name</label>
          <input type="text" name="First Name" required class="w-full border rounded-xl px-4 py-3 text-base">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Last Name</label>
          <input type="text" name="Last Name" required class="w-full border rounded-xl px-4 py-3 text-base">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
        <input type="email" name="Email" required class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Phone</label>
        <input type="tel" name="Phone" required class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Service</label>
        <!-- Sub-services for location pages -->
        <select name="Service" class="w-full border rounded-xl px-4 py-3 text-base">
          <option>Shower Replacement</option>
          <option>Tub-to-Shower Conversion</option>
          <option>Walk-In Tub Installation</option>
          <option>Full Bathroom Remodel</option>
          <option>Aging-in-Place Renovation</option>
          <option>Kitchen Remodel</option>
          <option>Handyman</option>
          <option>Other / Not Sure</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">City</label>
        <input type="text" name="City" placeholder="Your city" class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Preferred Date</label>
        <input type="date" name="Preferred Date" class="w-full border rounded-xl px-4 py-3 text-base">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Time Window</label>
        <select name="Time Window" class="w-full border rounded-xl px-4 py-3 text-base">
          <option>Flexible / Any Time</option>
          <option>Morning (9:00 AM – 12:00 PM)</option>
          <option>Early Afternoon (12:00 PM – 3:00 PM)</option>
          <option>Late Afternoon (3:00 PM – 6:00 PM)</option>
          <option>Evening (6:00 PM – 7:30 PM)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Details</label>
        <textarea name="Details" rows="3" class="w-full border rounded-xl px-4 py-3 text-base"></textarea>
      </div>
      <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-3.5 rounded-xl">Send Request</button>
    </form>

    <div class="mt-6 space-y-3 text-center">
      <a href="https://client.swivl.tech/all-star-renovate-318dbc/scheduler?widget=scheduler" target="_blank" class="block border-2 border-emerald-600 text-emerald-600 py-3.5 rounded-xl font-semibold">Schedule with Swivl</a>
      <a href="tel:5015043398" class="block text-emerald-600 font-semibold py-2">Call (501) 504-3398</a>
    </div>
  </div>
</body>
</html>
