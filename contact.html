<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact All-Star Renovations | Conway, AR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1329] text-white">
  <div class="max-w-lg mx-auto px-4 py-12">
    <a href="/" class="text-orange-400">← Home</a>
    <h1 class="text-2xl font-bold mt-4 mb-6">Contact All-Star Renovations</h1>
    <p class="mb-4">Call (501) 504-3398 or use the form below.</p>
    <form action="mailto:info@allstarreno.com" method="POST" enctype="text/plain" class="space-y-3">
      <input type="text" name="First Name" placeholder="First Name" required class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3">
      <input type="text" name="Last Name" placeholder="Last Name" required class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3">
      <input type="email" name="Email" placeholder="Email" required class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3">
      <input type="tel" name="Phone" placeholder="Phone" required class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3">
      <select name="Service" class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3">
        <option>Bathroom Remodeling</option>
        <option>Kitchen Remodeling</option>
        <option>Handyman Services</option>
        <option>Not Sure</option>
      </select>
      <input type="text" name="City" placeholder="City" class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3">
      <textarea name="Details" placeholder="Project details" rows="3" class="w-full bg-slate-800 border border-white/20 rounded-lg px-3 py-3"></textarea>
      <button type="submit" class="w-full bg-orange-600 py-3 rounded-lg font-semibold">Send Request</button>
    </form>
    <div class="mt-8">
      <iframe src="https://client.swivl.tech/all-star-renovate-318dbc/scheduler?widget=scheduler" class="w-full h-[480px] rounded-lg border-0" title="Schedule"></iframe>
    </div>
  </div>
</body>
</html>
