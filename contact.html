<body class="bg-[#0b1329] text-white">
  <div class="max-w-lg mx-auto px-4 py-10">

    <h1 class="text-2xl font-bold mt-4 mb-2">Contact All-Star Renovations</h1>

      <button type="submit" class="w-full bg-orange-600 py-3 rounded-lg font-semibold">Send Request</button>
